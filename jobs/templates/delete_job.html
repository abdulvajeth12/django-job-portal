{% extends 'base.html' %}

{% block title %}Delete Job{% endblock %}

{% block content %}
<h2>Delete Job</h2>

<p>Are you sure you want to delete "{{ job.title }}"?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
    <a href="{% url 'job_details' job.slug %}">Cancel</a>
</form>
{% endblock %}
